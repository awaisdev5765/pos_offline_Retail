name: offline_pos_system
description: A fully offline Point-of-Sale system with Khata (credit) management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.1
  path: ^1.8.3
  sqlite3: ^2.4.0
  
  # Encryption
  crypto: ^3.0.3
  
  # UI & Navigation
  go_router: ^12.1.3
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  
  # Barcode Scanner
  mobile_scanner: ^3.5.6
  
  # PDF & Printing
  pdf: ^3.8.5
  printing: ^5.11.1
  
  # File Operations
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  share_plus: ^7.2.1
  
  # Excel Export
  excel: ^4.0.6
  open_file: ^3.3.2
  
  # Thermal Printing
  bluetooth_print: 4.3.0
  permission_handler: ^11.0.1
  
  # Utilities
  intl: ^0.20.2
  easy_localization: ^3.0.7
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  
  # Icons
  cupertino_icons: ^1.0.2
  
  # Charts
  fl_chart: ^0.65.0
  
  # Audio
  audioplayers: ^5.2.1
  
  
  # URL Launcher
  url_launcher: ^6.2.2
  
  # Haptic Feedback
  vibration: ^3.1.4
  
  # CSV Export
  csv: ^5.0.2
  
  # Email functionality
  mailer: ^6.0.1
  
  # QR Code
  qr_flutter: ^4.1.0
  qr: ^3.0.1
  
  # Toast notifications
  fluttertoast: ^8.2.4
  
  # Local Notifications
  flutter_local_notifications: ^17.2.2
  
  # Network & Multi-PC Sync
  socket_io_client: ^2.0.3+1
  http: ^1.1.0
  connectivity_plus: ^5.0.2
  network_info_plus: ^4.0.2
  multicast_dns: ^0.3.2+3
  
  # System Tray (Windows)
  system_tray: ^0.1.1
  
  # Desktop Window Management
  window_manager: ^0.3.7
  
  # Drag and Drop
  desktop_drop: ^0.4.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  riverpod_generator: ^2.3.9
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/app_icon.png
    - assets/translations/
    - assets/images/
    - assets/sounds/
    - assets/sounds/beep.txt
    - assets/sounds/success.txt
    - assets/sounds/error.txt
    - assets/sounds/cash_register.txt
    - assets/sounds/alert.txt
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

dependency_overrides:
  bluetooth_print:
    path: packages/bluetooth_print

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#206BC4"
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: true
    icon_size: 256
    image_path: "assets/app_icon.png"
  image_path: "assets/app_icon.png"
